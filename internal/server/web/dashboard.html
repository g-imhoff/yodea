<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yodea dashboard</title>
<style>
body{font-family:system-ui,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem}
li{margin:.4rem 0}
.meta{color:#555;font-size:.85em}
button{cursor:pointer}
</style>
</head>
<body>
<h1>yodea</h1>
<h2>My previews</h2>
<ul id="sites"><li class="meta">Loading.</li></ul>
<h2>Recently viewed</h2>
<ul id="views"><li class="meta">Loading.</li></ul>
<p><button id="out">Log out</button></p>
<script>
const base = location.protocol + "//" + location.host;
async function get(p) {
  const r = await fetch(p);
  if (r.status === 401) { location.href = "/login?next=/"; return null; }
  return r.json();
}
function hostOf(label) { return location.protocol + "//" + label + "." + location.host + "/"; }
(async () => {
  const s = await get("/api/sites");
  const ul = document.getElementById("sites");
  ul.innerHTML = "";
  if (!s || !s.sites || !s.sites.length) ul.innerHTML = "<li class='meta'>Nothing pushed yet. Run yodea init, then yodea push.</li>";
  for (const site of (s.sites || [])) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = hostOf(site.label); a.textContent = site.project;
    li.append(a, ` `);
    const span = document.createElement("span");
    span.className = "meta";
    span.textContent = `${site.files} files, push with: yodea push --project ${site.project}`;
    li.append(span);
    ul.append(li);
  }
  const v = await get("/api/views");
  const vl = document.getElementById("views");
  vl.innerHTML = "";
  if (!v || !v.views || !v.views.length) vl.innerHTML = "<li class='meta'>Nothing viewed yet.</li>";
  for (const view of (v.views || [])) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = hostOf(view.label); a.textContent = view.label;
    li.append(a);
    vl.append(li);
  }
})();
document.getElementById("out").addEventListener("click", async () => {
  await fetch("/api/logout", {method: "POST"});
  location.href = "/login";
});
</script>
</body>
</html>
